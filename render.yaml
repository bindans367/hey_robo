services:
  - type: web
    name: hey-robo-brain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && python build_knowledge.py
    startCommand: python robo_brain.py
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: ROBO_PUBLIC
        value: "true"
      - key: ROBO_ADMIN_PASSWORD
        sync: false
